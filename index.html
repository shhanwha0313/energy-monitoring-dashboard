<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통합 에너지 모니터링 대시보드</title>
  <style>
    :root {
      --navy: #0c2340;
      --navy-2: #1a365d;
      --blue: #1e5fad;
      --blue-soft: #e8f0fb;
      --orange: #f37021;
      --accent: #f37021;
      --accent-hover: #d95d16;
      --orange-soft: #fff4ee;
      --green: #16a34a;
      --red: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --panel: #ffffff;
      --shadow-sm: 0 4px 20px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 4px 20px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard Variable", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 400px);
      line-height: 1.6;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px 40px;
    }

    /* Hero */
    .hero {
      overflow: hidden;
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
    }

    .hero-inner {
      background: linear-gradient(135deg, #0c2340 0%, #1a365d 100%);
      padding: 28px 32px;
      color: #fff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .hero-inner::after {
      content: '';
      position: absolute;
      right: 0; top: 0;
      width: 300px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(243,112,33,0.05));
      pointer-events: none;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: #fff;
    }

    /* 탭 (hero 우측) */
    .hero-tabs {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.65);
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.14);
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(243,112,33,0.35);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.75fr);
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-pad { padding: 18px; }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      position: relative;
      padding-left: 12px;
    }

    .section-title::before {
      content: '';
      position: absolute;
      left: 0; top: 3px; bottom: 3px;
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    .section-desc {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }

    .detail-link-btn:hover {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* ── KPI 섹션 그룹 ── */
    .kpi-overview {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    .kpi-section {
      width: 100%;
      min-width: 0;
    }

    .kpi-section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    /* 국내 지표: 3열 카드 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .kpi-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px 16px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 18px;
    }

    .kpi-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      text-transform: none;
      letter-spacing: -0.01em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .kpi-title::before {
      content: '';
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent);
      flex: 0 0 auto;
    }

    .kpi-date {
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
    }

    .kpi-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--text);
    }

    .kpi-unit {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .delta {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }
    .delta.up { color: var(--red); }
    .delta.down { color: #2563eb; }
    .delta.flat { color: #94a3b8; }


    /* 국제 지표: 상품별 1행 + 3개 지표 균등 배열 */
    .intl-list {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    .intl-row {
      display: grid;
      grid-template-columns: 112px repeat(3, minmax(0, 1fr)) 54px;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.12s;
    }

    .intl-row:last-child {
      border-bottom: none;
    }

    .intl-row:hover {
      background: rgba(243,112,33,0.03);
    }

    .intl-row-label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .intl-row-label::before {
      content: '';
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent);
      display: inline-block;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
    }

    .intl-row-label-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 0;
    }

    .intl-row-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      white-space: nowrap;
    }

    .intl-row-unit {
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      line-height: 1.2;
      white-space: nowrap;
    }

    .intl-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      min-width: 0;
    }

    .intl-metric-name {
      font-size: 10.5px;
      color: #94a3b8;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .intl-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .intl-sub {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }
    .intl-sub.up { color: var(--red); }
    .intl-sub.down { color: #2563eb; }
    .intl-sub.flat { color: #94a3b8; }

    .intl-date {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .issue-list, .news-list, .policy-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .issue-item, .news-item, .policy-item {
      border: 1px solid #e2e8f0;
      border-radius: 13px;
      padding: 13px 14px;
      background: #ffffff;
    }

    .issue-item {
      background: linear-gradient(180deg, #fff4ee 0%, #ffffff 100%);
      border-color: #ffd0b0;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 7px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge.important { color: #c2410c; background: #fff7ed; border-color: #fdba74; }
    .badge.normal { color: #b45309; background: #fffbeb; border-color: #fde68a; }
    .badge.ref { color: #475569; background: #f8fafc; border-color: #cbd5e1; }
    .badge.status { color: var(--navy); background: rgba(12,35,64,0.06); border-color: rgba(12,35,64,0.15); }

    .meta-text {
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
    }

    .item-title {
      color: #0f172a;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .item-body {
      color: #475569;
      font-size: 12.5px;
      line-height: 1.6;
      margin: 0;
    }

    .item-impact {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #eef2f7;
      color: #334155;
      font-size: 12.5px;
      line-height: 1.55;
    }

    .item-impact strong { color: var(--accent); margin-right: 5px; }

    /* 금일 주요 기사 카드: 제목/요약 구분만 살짝 강화 */
    .news-item .item-title {
      margin-bottom: 8px;
      color: #0b1324;
    }

    .news-item .item-body {
      color: #64748b;
      font-size: 12px;
      line-height: 1.65;
      padding-top: 6px;
      border-top: 1px solid #eef2f7;
    }

    .policy-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .policy-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .policy-title {
      font-size: 14px;
      line-height: 1.35;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .policy-fields {
      display: grid;
      gap: 5px;
      color: #475569;
      font-size: 12px;
      line-height: 1.45;
    }

    .policy-fields b {
      color: #0f172a;
      font-weight: 900;
    }



    /* ── Overview 정책 타임라인: 3.policy.html 렌더링 기준 축약형 ── */
    .overview-policy-scroll {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ffffff;
      max-height: none;
    }

    .overview-timeline-shell {
      --left-col: 120px;
      --policy-col: 185px;
      --track-h: 62px;
      display: grid;
      grid-template-columns: var(--left-col) minmax(0, 1fr);
      min-width: 100%;
      position: relative;
      background: #ffffff;
    }

    .overview-year-cell,
    .overview-time-axis {
      height: 56px;
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .overview-year-cell { border-right: 0; }
    .overview-time-axis { z-index: 19; overflow: hidden; }

    .overview-axis-title-spacer {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--policy-col);
      border-right: 1px solid var(--line);
      background: #fbfdff;
      pointer-events: none;
    }

    .overview-axis-time-grid {
      position: absolute;
      left: var(--policy-col);
      right: 10px;
      top: 0;
      bottom: 0;
      overflow: hidden;
    }

    .overview-month-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      color: #31405b;
      font-size: 12.5px;
      font-weight: 800;
      padding-top: 19px;
      text-align: center;
      transform: translateX(-50%);
      white-space: nowrap;
      min-width: 44px;
      pointer-events: none;
    }

    .overview-month-boundary,
    .overview-lane-month-boundary {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(226, 232, 240, .95);
      pointer-events: none;
    }
    .overview-lane-month-boundary { z-index: 1; opacity: .72; }

    .overview-today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 2px dashed rgba(243, 112, 33, .65);
      z-index: 12;
      pointer-events: none;
    }

    .overview-today-label {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #ffffff;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 6px 15px rgba(243, 112, 33, .28);
    }

    .overview-category-cell {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fbfdff;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 18px 8px;
      position: relative;
    }

    .overview-cat-icon {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      flex: 0 0 auto;
      box-shadow: inset 0 -8px 14px rgba(2, 12, 32, .14), 0 7px 16px rgba(2, 12, 32, .13);
    }
    .overview-cat-icon.market { background: #2563eb; }
    .overview-cat-icon.grid { background: #0f9488; }
    .overview-cat-icon.carbon { background: #0F766E; }
    .overview-cat-icon.lng { background: #6d3ac9; }
    .overview-cat-icon.renew { background: #f97316; }
    .overview-cat-icon.etc { background: #64748b; }
    .overview-cat-icon.energy { background: #0ea5e9; position: relative; font-size: 0; }
    .overview-cat-icon.energy::before {
      content: "";
      width: 11px;
      height: 15px;
      background: #ffffff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: block;
    }

    .overview-cat-name {
      font-size: 12.5px;
      line-height: 1.25;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -.03em;
      margin-top: 6px;
    }

    .overview-cat-count {
      position: absolute;
      right: 8px;
      bottom: 10px;
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      background: #eef2f7;
      border-radius: 999px;
      padding: 3px 8px;
    }

    .overview-lane-content {
      position: relative;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      background: #ffffff;
    }

    .overview-lane-title-col {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--policy-col);
      border-right: 1px solid var(--line);
      background: linear-gradient(90deg, #ffffff, #fbfdff);
      z-index: 2;
      pointer-events: none;
    }

    .overview-lane-time-grid {
      position: absolute;
      left: var(--policy-col);
      right: 10px;
      top: 0;
      bottom: 0;
      z-index: 1;
      pointer-events: none;
    }

    .overview-track {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--track-h);
      border-radius: 11px;
      transition: .16s ease;
      z-index: 4;
    }
    .overview-track:hover { background: rgba(243, 112, 33, .04); }

    .overview-track-time {
      position: absolute;
      left: var(--policy-col);
      right: 10px;
      top: 0;
      bottom: 0;
      z-index: 5;
    }

    .overview-policy-name {
      position: absolute;
      top: 30px;
      left: 10px;
      transform: translateY(-50%);
      max-width: calc(var(--policy-col) - 20px);
      color: #0f172a;
      font-size: 12.5px;
      font-weight: 950;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 9;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .9);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 0 1px 9px;
      background: transparent;
    }
    .overview-policy-name::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1px;
      bottom: 1px;
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .overview-policy-title-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overview-status-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 7px;
      margin-left: 6px;
      vertical-align: middle;
      flex: 0 0 auto;
    }
    .overview-status-발표,
    .overview-status-공개 { background: #dbeafe; color: #1d4ed8; }
    .overview-status-검토중,
    .overview-status-추진중,
    .overview-status-후속\ 미정 { background: #fff4ee; color: #d97706; }
    .overview-status-시행 { background: #dcfce7; color: #15803d; }
    .overview-status-종료 { background: #e5e7eb; color: #475569; }

    .overview-bar {
      position: absolute;
      top: 30px;
      height: 3px;
      border-radius: 999px;
      z-index: 3;
    }
    .overview-bar.solid { background: linear-gradient(90deg, #2563eb, var(--orange) 48%, #16a34a); }
    .overview-bar.history { background: #2563eb; }
    .overview-bar.dashed {
      height: 0;
      border-top: 2px dashed var(--orange);
      border-radius: 0;
    }
    .overview-bar.dashed::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -5px;
      width: 8px;
      height: 8px;
      border-top: 2px solid var(--orange);
      border-right: 2px solid var(--orange);
      transform: rotate(45deg);
    }

    .overview-marker {
      position: absolute;
      top: 24px;
      width: 13px;
      height: 13px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .18);
      z-index: 6;
    }
    .overview-marker.announce { background: #2563eb; border-radius: 999px; transform: translateX(-50%); }
    .overview-marker.review { background: var(--orange); border-radius: 2px; transform: translateX(-50%) rotate(45deg); }
    .overview-marker.effective { background: #16a34a; border-radius: 999px; transform: translateX(-50%); }
    .overview-marker.end { background: #64748b; border-radius: 999px; transform: translateX(-50%); }

    .overview-event-label {
      position: absolute;
      top: 46px;
      transform: translateX(-50%);
      max-width: 100px;

  <script>
    const DATA_FILES = {
      smp: ["./data/epsis_index_data.json", "./epsis_index_data.json"],
      ets: ["./data/ets_index_data.json", "./ets_index_data.json"],
      rec: ["./data/rec_index_data.json", "./rec_index_data.json"],
      oil: ["./data/oil_index_data.json", "./oil_index_data.json"],
      coal: ["./data/coal_index_data.json", "./coal_index_data.json"],
      lng: ["./data/lng_index_data.json", "./lng_index_data.json"],
      todayNews: ["./data/today_news.json", "./today_news.json"],
      archiveNews: ["./data/archive_news.json", "./archive_news.json"],
      newsSummary: ["./data/news_summary.json", "./news_summary.json"],
      policy: ["./data/policy_dashboard_data.json", "./policy_dashboard_data.json"]
    };

    const state = {
      datasets: {},
      errors: {}
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isValidNumber(value) {
      return value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value));
    }

    function toNumber(value) {
      return isValidNumber(value) ? Number(value) : null;
    }

    function formatNumber(value, digits = 0) {
      if (!isValidNumber(value)) return "-";
      return Number(value).toLocaleString("ko-KR", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function formatDate(value) {
      if (!value) return "-";
      const str = String(value);
      if (str.includes("-")) {
        const parts = str.split("-");
        if (parts.length === 3) return `${Number(parts[1])}/${Number(parts[2])}`;
      }
      if (str.includes(".")) {
        const parts = str.split(".");
        if (parts.length >= 3) return `${Number(parts[1])}/${Number(parts[2])}`;
      }
      return str;
    }

    function parseDate(value) {
      if (!value) return null;
      const str = String(value).trim().replaceAll(".", "-");
      const parts = str.split("-").map(Number);
      if (parts.length < 3 || parts.some(n => !Number.isFinite(n))) return null;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function sortRowsByDate(rows) {
      return [...(rows || [])].filter(row => row && row.date).sort((a, b) => {
        const da = parseDate(a.date);
        const db = parseDate(b.date);
        if (!da || !db) return String(a.date).localeCompare(String(b.date));
        return da - db;
      });
    }

    function latestPair(rows, key) {
      const valid = sortRowsByDate(rows)
        .map(row => ({ row, value: toNumber(row[key]) }))
        .filter(item => item.value !== null);
      return {
        latest: valid.at(-1) || null,
        previous: valid.at(-2) || null
      };
    }

    function deltaText(latest, previous, digits = 2) {
      if (!latest || !previous) return { text: "비교값 없음", cls: "flat" };
      const diff = latest.value - previous.value;
      const pct = previous.value !== 0 ? diff / previous.value * 100 : 0;
      const abs = Math.abs(diff);
      const sign = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";
      const cls = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      return {
        text: `${sign} ${formatNumber(abs, digits)} (${formatNumber(Math.abs(pct), 2)}%)`,
        cls
      };
    }

    function parseLooseNumber(value) {
      if (value === null || value === undefined || value === "") return null;
      if (typeof value === "number") return Number.isFinite(value) ? value : null;

      const cleaned = String(value)
        .replaceAll(",", "")
        .replaceAll("%", "")
        .replaceAll("▲", "")
        .replaceAll("▼", "")
        .replaceAll("+", "")
        .trim();

      const num = Number(cleaned);
      return Number.isFinite(num) ? num : null;
    }

    function pickRowNumber(row, keys) {
      for (const key of keys) {
        const num = parseLooseNumber(row?.[key]);
        if (num !== null) return num;
      }
      return null;
    }

    function rawDeltaText(row, deltaKeys, rateKeys, digits = 0) {
      const diff = pickRowNumber(row, deltaKeys);
      const pct = pickRowNumber(row, rateKeys);

      if (diff === null && pct === null) {
        return { text: "비교값 없음", cls: "flat" };
      }

      const direction = diff !== null && diff !== 0 ? diff : (pct ?? 0);
      const sign = direction > 0 ? "▲" : direction < 0 ? "▼" : "-";
      const cls = direction > 0 ? "up" : direction < 0 ? "down" : "flat";
      const diffText = diff === null ? "-" : formatNumber(Math.abs(diff), digits);
      const pctText = pct === null ? "-" : formatNumber(Math.abs(pct), 2);

      return {
        text: `${sign} ${diffText} (${pctText}%)`,
        cls
      };
    }

    async function loadJson(paths) {
      const errors = [];
      for (const path of paths) {
        try {
          const res = await fetch(`${path}${path.includes("?") ? "&" : "?"}v=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          let text = await res.text();
          text = text.replace(/^\uFEFF/, "").replace(/\bNaN\b/g, "null");
          return { data: JSON.parse(text), path };
        } catch (err) {
          errors.push(`${path}: ${err.message}`);
        }
      }
      throw new Error(errors.join(" / "));
    }

    async function loadAllData() {
      const entries = Object.entries(DATA_FILES);
      await Promise.all(entries.map(async ([key, paths]) => {
        try {
          const result = await loadJson(paths);
          state.datasets[key] = result.data;
          state.datasets[`${key}Path`] = result.path;
        } catch (err) {
          state.errors[key] = err.message;
        }
      }));
    }

    function simpleKpiCard(def) {
      const pair = latestPair(def.rows, def.mainKey);
      const latest = pair.latest;
      const previous = pair.previous;
      const row = latest?.row || {};
      const delta = def.useRawDelta
        ? rawDeltaText(row, def.deltaKeys || [], def.rateKeys || [], def.digits)
        : deltaText(latest, previous, def.digits);
      return `
        <div class="kpi-card">
          <div class="kpi-top">
            <div class="kpi-title">${escapeHtml(def.title)}</div>
            <div class="kpi-date">${escapeHtml(formatDate(row.date))}</div>
          </div>
          <div class="kpi-main">
            <div class="kpi-value">${formatNumber(latest?.value, def.digits)}</div>
            <div class="kpi-unit">${escapeHtml(def.unit)}</div>
          </div>
          <div class="delta ${delta.cls}">${escapeHtml(delta.text)}</div>
        </div>
      `;
    }

    function intlTableRow(def) {
      const rows = def.rows || [];
      const pair = latestPair(rows, def.metrics[0].key);
      const dateStr = formatDate(pair.latest?.row?.date);

      const cells = def.metrics.map(metric => {
        const p = latestPair(rows, metric.key);
        const delta = deltaText(p.latest, p.previous, metric.digits);
        const val = formatNumber(p.latest?.value, metric.digits);
        return `
          <div class="intl-cell">
            <div class="intl-metric-name">${escapeHtml(metric.label)}</div>

    function parsePeriodToDate(value) {
      if (!value || typeof value !== "string") return null;
      const v = value.trim();
      let m = v.match(/^(\d{4})-(\d{1,2})$/);
      if (m) {
        const d = new Date(Number(m[1]), Number(m[2]) - 1, 15);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      m = v.match(/^(\d{4})-?Q([1-4])$/i);
      if (m) {
        const q = Number(m[2]);
        const middleMonth = (q - 1) * 3 + 1;
        const d = new Date(Number(m[1]), middleMonth, 15);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      m = v.match(/^(\d{4})$/);
      if (m) {
        const d = new Date(Number(m[1]), 6, 1);
        return Number.isNaN(d.getTime()) ? null : d;
      }
      return null;
    }

    function getTemporalDate(dateValue, periodValue) {
      return parseDate(dateValue) || parsePeriodToDate(periodValue);
    }

    function fmtDate(value) {
      const d = parseDate(value);
      if (!d) return value || "-";
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    }

    function fmtPeriod(value, precision) {
      if (!value) return "-";
      const v = String(value).trim();
      let m = v.match(/^(\d{4})-(\d{1,2})$/);
      if (m) return `${m[1]}.${String(Number(m[2])).padStart(2, "0")}`;
      m = v.match(/^(\d{4})-?Q([1-4])$/i);
      if (m) return `${m[1]}년 ${m[2]}분기`;
      m = v.match(/^(\d{4})$/);
      if (m) return `${m[1]}년`;
      return v;
    }

    function fmtTemporal(dateValue, periodValue, precision, label) {
      if (label) return label;
      if (dateValue) return fmtDate(dateValue);
      if (periodValue) return fmtPeriod(periodValue, precision);
      return "-";
    }

    function fmtShortTemporal(dateValue, periodValue, precision, label) {
      if (dateValue) {
        const d = parseDate(dateValue);
        return d ? `${d.getMonth() + 1}/${d.getDate()}` : "";
      }
      if (label) return label;
      if (periodValue) return fmtPeriod(periodValue, precision);
      return "";
    }

    function validPolicy(p) {
      return p && p.policy_id && p.policy_name && p.category && p.status;
    }

    function unique(arr) {
      return [...new Set((arr || []).filter(Boolean))];
    }

    function policyDates(policy) {
      const dates = [];
      ["first_announce_date", "latest_event_date", "expected_date"].forEach(k => {
        const d = parseDate(policy[k]);
        if (d) dates.push(d);
      });
      const expectedPeriodDate = parsePeriodToDate(policy.expected_period);
      if (expectedPeriodDate) dates.push(expectedPeriodDate);
      (policy.events || []).forEach(e => {
        const d = getTemporalDate(e.event_date, e.event_period);
        if (d) dates.push(d);
      });
      return dates;
    }

    function detectBaseYear(policies) {
      const years = unique(policies.flatMap(p => policyDates(p).map(d => d.getFullYear()))).sort();
      const todayYear = new Date().getFullYear();
      if (years.includes(todayYear)) return todayYear;
      return years[0] || todayYear;
    }

    function computePolicyOverviewRange(policies) {
      const baseYear = detectBaseYear(policies);
      return { start: new Date(baseYear, 0, 1), end: new Date(baseYear, 11, 31), label: `${baseYear}년` };
    }

    function posPolicyPct(date, range) {
      if (!date || !range) return null;
      const total = range.end.getTime() - range.start.getTime();
      if (total <= 0) return 0;
      return ((date.getTime() - range.start.getTime()) / total) * 100;
    }

    function clampPct(x, min = 0, max = 100) {
      if (x === null || Number.isNaN(x)) return null;
      return Math.max(min, Math.min(max, x));
    }

    function eventMarkerClass(type) {
      if (type === "공개" || type === "발표") return "announce";
      if (type === "시행") return "effective";
      if (type === "종료") return "end";
      if (["이슈", "경과", "개정", "검토", "입법예고", "의견수렴", "확정"].includes(type)) return "review";
      return "review";
    }

    function hasKnownEnd(policy) {
      if (policy.expected_date || policy.expected_period) return true;
      return (policy.events || []).some(e => e.event_type === "시행" && (e.event_date || e.event_period));
    }

    function isOpenEndedPolicy(policy) {
      const endType = String(policy.timeline_end_type || "");
      if (endType.includes("미정") || endType.includes("상시")) return true;
      if (policy.open_ended === true) return true;
      if (policy.timeline_style?.line_type === "dashed_arrow" && !hasKnownEnd(policy)) return true;
      return false;
    }

    function statusBadge(status) {
      const safeStatus = escapeHtml(status || "-");
      return `<span class="overview-status-badge overview-status-${safeStatus}">${safeStatus}</span>`;
    }

    const POLICY_CATEGORY_ICONS = {
      "전력": { icon: "⚡︎", cls: "market" },
      "전력시장": { icon: "⚡︎", cls: "market" },
      "에너지": { icon: "", cls: "energy" },
      "계통·망": { icon: "▵", cls: "grid" },
      "환경": { icon: "CO₂", cls: "carbon" },
      "LNG·연료": { icon: "◆", cls: "lng" },
      "재생·분산에너지": { icon: "☀", cls: "renew" },
      "기타": { icon: "•", cls: "etc" },
    };

    function getPolicyCategories(rawData, policies) {
      const fromData = rawData?.codes?.categories || [];
      const fromPolicies = unique(policies.map(p => p.category));
      return unique([...fromData, ...fromPolicies]).filter(c => policies.some(p => p.category === c));
    }

    function matchesPolicyOverviewPeriod(policy, range) {
      const dates = policyDates(policy);
      if (!dates.length) return true;
      const min = new Date(Math.min(...dates.map(d => d.getTime())));
      const max = new Date(Math.max(...dates.map(d => d.getTime())));
      if (policy.open_ended || policy.timeline_style?.line_type === "dashed_arrow") return min <= range.end;
      return max >= range.start && min <= range.end;
    }

    function monthTicks(range) {
      const ticks = [];
      let d = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
      while (d <= range.end) {
        ticks.push(new Date(d));
        d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      }
      return ticks;
    }

    function monthLabelPct(monthStart, range) {
      const nextMonth = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 1);
      const left = clampPct(posPolicyPct(monthStart, range), 0, 100);
      const right = clampPct(posPolicyPct(nextMonth, range), 0, 100);
      if (left === null || right === null) return left;
      return (left + right) / 2;
    }

    function renderOverviewMonthBoundaries(range) {
      return monthTicks(range).map((d, i) => {
        if (i === 0) return "";
        const left = clampPct(posPolicyPct(d, range), 0, 100);
        return `<div class="overview-lane-month-boundary" style="left:${left}%"></div>`;
      }).join("");
    }

    function renderOverviewAxis(range) {
      const ticks = monthTicks(range);
      const todayPct = clampPct(posPolicyPct(new Date(), range));
      const monthsHtml = ticks.map((d, i) => {
        const labelLeft = monthLabelPct(d, range);
        const boundary = i > 0 ? `<div class="overview-month-boundary" style="left:${clampPct(posPolicyPct(d, range), 0, 100)}%"></div>` : "";
        return `
          <div class="overview-month-tick" style="left:${labelLeft}%">${d.getMonth() + 1}월</div>
          ${boundary}
        `;
      }).join("");
      const todayHtml = todayPct !== null && todayPct >= 0 && todayPct <= 100
        ? `<div class="overview-today-line" style="left:${todayPct}%"><span class="overview-today-label">Today</span></div>`
        : "";

      return `
        <div class="overview-year-cell"></div>
        <div class="overview-time-axis">
          <div class="overview-axis-title-spacer"></div>
          <div class="overview-axis-time-grid">
            ${monthsHtml}
            ${todayHtml}
          </div>
        </div>
      `;
    }

    function renderOverviewPolicyTrack(policy, index, range) {
      const top = 14 + index * 62;
      const allEvents = (policy.events || [])
        .filter(e => e.event_date || e.event_period)
        .map(e => ({ ...e, _date: getTemporalDate(e.event_date, e.event_period) }))
        .filter(e => e._date)
        .sort((a, b) => a._date - b._date);
      const visibleEvents = allEvents.filter(e => e._date >= range.start && e._date <= range.end);

      const startDate = allEvents[0]?._date || parseDate(policy.first_announce_date) || parsePeriodToDate(policy.expected_period) || range.start;
      const expectedEnd = getTemporalDate(policy.expected_date, policy.expected_period);
      const eventEnd = allEvents.at(-1)?._date;
      const endDate = expectedEnd || parseDate(policy.latest_event_date) || eventEnd || startDate;
      const startPct = clampPct(posPolicyPct(startDate, range), 0, 100);
      const open = isOpenEndedPolicy(policy);
      const rawEndPct = expectedEnd ? clampPct(posPolicyPct(expectedEnd, range), 0, 100) : (open ? 96 : clampPct(posPolicyPct(endDate, range), 0, 100));
      const endPct = Math.max(startPct ?? 0, rawEndPct ?? 96);
      const width = Math.max(4, endPct - (startPct ?? 0));
      const expectedInRange = expectedEnd && expectedEnd >= range.start && expectedEnd <= range.end;
      const beforeRangeEvents = allEvents.filter(e => e._date <= range.end);
      const lastEventDate = beforeRangeEvents.at(-1)?._date || startDate;
      const lastEventPct = clampPct(posPolicyPct(lastEventDate, range), 0, 100);

      let barHtml = "";
      if (open && visibleEvents.length >= 2 && lastEventPct !== null && startPct !== null && lastEventPct > startPct) {
        barHtml = `
          <div class="overview-bar history" style="left:${startPct}%; width:${Math.max(2, lastEventPct - startPct)}%"></div>
          <div class="overview-bar dashed" style="left:${lastEventPct}%; width:${Math.max(4, endPct - lastEventPct)}%"></div>
        `;
      } else {
        barHtml = `<div class="overview-bar ${open ? "dashed" : "solid"}" style="left:${startPct}%; width:${width}%"></div>`;
      }

      const eventsHtml = visibleEvents.map(e => {
        const left = clampPct(posPolicyPct(e._date, range), 0, 100);
        const label = `${e.event_label || e.event_type} ${fmtShortTemporal(e.event_date, e.event_period, e.event_precision)}`.trim();
        const title = `${e.event_label || e.event_type} ${fmtTemporal(e.event_date, e.event_period, e.event_precision)}
${e.event_summary || ""}`;
        return `
          <div class="overview-marker ${eventMarkerClass(e.event_type)}" style="left:${left}%" title="${escapeHtml(title)}"></div>
          <div class="overview-event-label" style="left:${left}%">${escapeHtml(label)}</div>
        `;
      }).join("");

      const expectedLeft = expectedInRange ? clampPct(posPolicyPct(expectedEnd, range), 0, 100) : null;
      const expectedHtml = expectedInRange && !visibleEvents.some(e => Math.abs(e._date - expectedEnd) < 86400000)
        ? `
          <div class="overview-marker effective" style="left:${expectedLeft}%" title="${escapeHtml(fmtTemporal(policy.expected_date, policy.expected_period, policy.expected_precision, policy.expected_label))}"></div>
          <div class="overview-event-label" style="left:${expectedLeft}%">${escapeHtml(fmtShortTemporal(policy.expected_date, policy.expected_period, policy.expected_precision, policy.expected_label))}</div>
        `
        : "";

      const undated = (policy.events || []).find(e => !e.event_date && !e.event_period && e.event_label);
      const endLabelRaw = undated?.event_label || policy.timeline_style?.end_label || policy.timeline_end_type || (policy.status === "후속 미정" ? "후속 미정" : "시행시점 미정") || "시행시점 미정";
      const endLabel = String(endLabelRaw).trim().toUpperCase() === "TBD" ? "시행시점 미정" : endLabelRaw;
      const openPillHtml = open && !expectedEnd
        ? `<div class="overview-end-pill-wrap"><span class="overview-end-pill">${escapeHtml(endLabel)}</span></div>`
        : "";

      return `
        <div class="overview-track" style="top:${top}px" data-policy-id="${escapeHtml(policy.policy_id)}">
          <div class="overview-policy-name">
            <span class="overview-policy-title-text">${escapeHtml(policy.short_name || policy.policy_name)}</span>
            ${statusBadge(policy.status)}
          </div>
          <div class="overview-track-time">
            ${barHtml}
            ${eventsHtml}
            ${expectedHtml}
            ${openPillHtml}
          </div>
        </div>
      `;
    }

    function renderPolicies() {
      const el = document.getElementById("policyList");
      const payload = state.datasets.policy || {};
      const policies = (Array.isArray(payload.policies) ? payload.policies : [])
        .filter(validPolicy)
        .map(p => ({
          ...p,
          keywords: Array.isArray(p.keywords) ? p.keywords : String(p.keywords || "").split(/[,;|/]/).map(x => x.trim()).filter(Boolean),
          events: Array.isArray(p.events) ? p.events : [],
        }));

      if (!policies.length) {
        el.innerHTML = `<div class="empty">표시할 정책 데이터가 없습니다.</div>`;
        return;
      }

      const range = computePolicyOverviewRange(policies);
      const filtered = policies.filter(p => matchesPolicyOverviewPeriod(p, range));
      const categories = getPolicyCategories(payload, policies).filter(c => filtered.some(p => p.category === c));

      if (!filtered.length || !categories.length) {
        el.innerHTML = `<div class="empty">1년 기준 범위에 표시할 정책·제도가 없습니다.</div>`;
        return;
      }

      const todayPct = clampPct(posPolicyPct(new Date(), range));
      const todayLine = todayPct !== null && todayPct >= 0 && todayPct <= 100
        ? `<div class="overview-today-line" style="left:${todayPct}%"></div>`
        : "";
      const monthBoundaryHtml = renderOverviewMonthBoundaries(range);
      const groupsHtml = categories.map(category => {
        const list = filtered.filter(p => p.category === category);
        if (!list.length) return "";
        const h = Math.max(94, 28 + list.length * 62);
        const meta = POLICY_CATEGORY_ICONS[category] || POLICY_CATEGORY_ICONS["기타"];
        const tracksHtml = list.map((p, i) => renderOverviewPolicyTrack(p, i, range)).join("");
        return `
          <div class="overview-category-cell" style="height:${h}px">
            <div class="overview-cat-icon ${meta.cls}">${escapeHtml(meta.icon)}</div>
            <div class="overview-cat-name">${escapeHtml(category)}</div>
            <div class="overview-cat-count">${list.length}건</div>
          </div>
          <div class="overview-lane-content" style="height:${h}px">
            <div class="overview-lane-title-col"></div>
            <div class="overview-lane-time-grid">
              ${monthBoundaryHtml}
              ${todayLine}
            </div>
            ${tracksHtml}
          </div>
        `;
      }).join("");

      el.innerHTML = `
        <div class="overview-policy-scroll">
          <div class="overview-timeline-shell" style="--month-count:${Math.max(1, monthTicks(range).length)}">
            ${renderOverviewAxis(range)}
            ${groupsHtml}
          </div>
        </div>
      `;
    }

    function latestDateFromRows(rows) {
      const sorted = sortRowsByDate(rows || []);
      return sorted.at(-1)?.date || "-";
    }

    function renderDataStatus() {
      const baseEl = document.getElementById("dataBaseDate");
      if (!baseEl) return;
      const summary = state.datasets.newsSummary || {};
      const baseDate = summary.base_date || latestDateFromRows(state.datasets.smp);
      baseEl.textContent = `데이터 기준: ${baseDate || "-"}`;
    }

    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const clockEl = document.getElementById("clock");
      if (!clockEl) return;
      clockEl.textContent = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function switchPanel(panel) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.panel === panel);
      });
      document.querySelectorAll(".panel").forEach(sec => {
        sec.classList.toggle("active", sec.id === `panel-${panel}`);
      });
      const frame = document.querySelector(`#panel-${panel} iframe`);
      if (frame) setTimeout(() => resizeIframe(frame), 100);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resizeIframe(iframe) {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc) return;
        const body = doc.body;
        const html = doc.documentElement;
        const h = Math.max(
          body?.scrollHeight || 0,
          body?.offsetHeight || 0,
          html?.clientHeight || 0,
          html?.scrollHeight || 0,
          html?.offsetHeight || 0
        );
        if (h) iframe.style.height = `${h + 20}px`;
      } catch (err) {
        // 다른 출처에서 열릴 때는 자동 높이 조정이 제한될 수 있습니다.
      }
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => switchPanel(btn.dataset.panel));
    });

    document.querySelectorAll("[data-jump]").forEach(btn => {
      btn.addEventListener("click", () => switchPanel(btn.dataset.jump));
    });

    document.querySelectorAll("iframe").forEach(frame => {
      frame.addEventListener("load", () => {
        resizeIframe(frame);
        setTimeout(() => resizeIframe(frame), 300);
        setTimeout(() => resizeIframe(frame), 1000);
      });
    });

    window.addEventListener("resize", () => {
      document.querySelectorAll("iframe").forEach(resizeIframe);
    });

    updateClock();
    setInterval(updateClock, 30000);

    loadAllData().then(() => {
      renderKpis();
      renderTodayImportant();
      renderPolicies();
      renderDataStatus();
    }).catch(err => {
      console.error(err);
      document.getElementById("kpiGrid").innerHTML = `<div class="error">통합 데이터 로드 중 오류가 발생했습니다.</div>`;
    });
  </script>
</body>
</html>
